plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

android {
    namespace "com.syndro.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.syndro.app"
        minSdk 21
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            // CI/CD environment: use keystore decoded from KEYSTORE_BASE64 secret
            // The workflow decodes it to android/app/keystore.jks
            if (System.getenv("KEYSTORE_PASSWORD") != null && file("keystore.jks").exists()) {
                storeFile file("keystore.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "syndro"
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Require a real release keystore. Falling back to debug signing here
            // would ship a publicly-known debug key, letting anyone forge updates
            // that overwrite the installed app. Fail the build instead.
            //
            // For deliberate local testing you may opt back into debug signing
            // with:  flutter build apk --release -PallowDebugSigning=true
            def hasReleaseKeystore = signingConfigs.release.hasProperty("storeFile") &&
                    signingConfigs.release.storeFile != null
            def allowDebugSigning = project.hasProperty("allowDebugSigning") &&
                    project.property("allowDebugSigning").toString().toBoolean()

            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else if (allowDebugSigning) {
                logger.warn("WARNING: release build is DEBUG-SIGNED (allowDebugSigning=true). Do not distribute this artifact.")
                signingConfig signingConfigs.debug
            } else {
                throw new GradleException(
                    "No release keystore configured. Set KEYSTORE_PASSWORD and provide " +
                    "android/app/keystore.jks, or pass -PallowDebugSigning=true for local testing only.")
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}
