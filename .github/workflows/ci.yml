name: ci

# Gate every push and pull request.
#
# The release workflow only ran on a v* tag, so nothing checked a pull request
# before it was merged. It also ran `flutter test`, which was failing, meaning a
# release could not actually be produced from main without noticing something
# was wrong.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, unlike release.yml which tracks `stable` and therefore
          # changes toolchain underneath you between releases.
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # No new issues. The analyzer is currently clean, so this is a hard gate.
        run: flutter analyze --no-pub

      # NOTE: there is deliberately no `dart format` gate. The repository is not
      # currently format-clean, so enabling one would turn CI red on day one.
      # Formatting the tree is a separate, deliberate change; until then, gating
      # on it would only block every pull request.

      # dart_test.yaml pins concurrency to 1 because the suite binds real sockets
      # and waits on real approval polls with tight deadlines.
      - name: Test
        run: flutter test --no-pub

      - name: Coverage
        run: flutter test --no-pub --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  # Secrets in committed files and in workflow logs. Cheap, and the release
  # pipeline interpolates a keystore secret into a shell script.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}