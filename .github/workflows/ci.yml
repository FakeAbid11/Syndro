name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      # The CI job type-checks and tests the Node/Electron code. It does not
      # ship an app, so downloading the ~120 MB Electron binary is wasted time
      # on every run.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: syndro-desktop-${{ matrix.os }}
          path: |
            desktop/dist
            desktop/web
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # electron-builder downloads the Electron zip and the NSIS toolchain on
      # first use; caching them keeps repeat installer builds to about a minute.
      - name: Cache Electron and NSIS
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Test the packaged Electron bridge
        run: npm run test:electron

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: syndro-electron-smoke
          path: desktop/release/electron-smoke.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: syndro-windows-setup
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: syndro-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web UI syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check the browser bundle parses
        run: node --check desktop/web/assets/app.js

      - name: Check every served asset exists
        run: |
          test -f desktop/web/index.html
          test -f desktop/web/assets/app.js
          test -f desktop/web/assets/style.css
