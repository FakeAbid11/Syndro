name: Release

# Unified release pipeline.
#   • Push a v* tag  → builds Windows + Android and publishes them to that release.
#   • Run manually (Actions ▸ Release ▸ Run workflow) and type a version, e.g.
#     1.1.0 → it bumps pubspec.yaml, commits, creates the v1.1.0 tag, then builds
#     and publishes the release. Leave the version blank for a build-only dry run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.1.0 (blank = build-only dry run, no release)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SQLITE_VERSION: '3450000'
  SQLITE_SHA256: '9778943E830EEAAB3557119E531DFF51BC6A0C4B153CF6256FC806369F5F8023'

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Resolve the version/tag and (for manual runs with a version) bump
  # pubspec.yaml + create the tag, so the build jobs check out a ready ref.
  # ──────────────────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      do_release: ${{ steps.resolve.outputs.do_release }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version & tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Triggered by a v* tag push — use the tag as-is.
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            {
              echo "do_release=true"
              echo "tag=$TAG"
              echo "version=$VERSION"
              echo "checkout_ref=$TAG"
              echo "bump=false"
            } >> "$GITHUB_OUTPUT"
          else
            IN="${{ github.event.inputs.version }}"
            if [ -n "$IN" ]; then
              VERSION="${IN#v}"
              if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::Version '$IN' must look like 1.2.3"
                exit 1
              fi
              TAG="v$VERSION"
              {
                echo "do_release=true"
                echo "tag=$TAG"
                echo "version=$VERSION"
                echo "checkout_ref=$TAG"
                echo "bump=true"
              } >> "$GITHUB_OUTPUT"
            else
              # Manual run with no version = build-only dry run (no tag, no release).
              {
                echo "do_release=false"
                echo "tag="
                echo "version=dev"
                echo "checkout_ref=${{ github.ref }}"
                echo "bump=false"
              } >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bump pubspec, commit & tag
        if: ${{ steps.resolve.outputs.bump == 'true' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          TAG="${{ steps.resolve.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists — pick a new version."
            exit 1
          fi
          # version name from input, build number from the run number.
          sed -i -E "s/^version:.*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml
          echo "pubspec version → $(grep '^version:' pubspec.yaml)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "ci: release $TAG"
          git tag "$TAG"
          # Pushes made with GITHUB_TOKEN do not re-trigger workflows, so no loop.
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$TAG"

  # ──────────────────────────────────────────────────────────────────────
  # Windows desktop
  # ──────────────────────────────────────────────────────────────────────
  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ''
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Windows build files
        run: |
          Remove-Item -Recurse -Force windows
          flutter create . --platforms=windows --project-name=syndro
          if (Test-Path test/widget_test.dart) { Remove-Item -Force test/widget_test.dart }
          (Get-Content windows/runner/Runner.rc) -replace 'VALUE "ProductName", "syndro"', 'VALUE "ProductName", "Syndro"' | Set-Content windows/runner/Runner.rc
          (Get-Content windows/runner/Runner.rc) -replace 'VALUE "FileDescription", "syndro"', 'VALUE "FileDescription", "Syndro"' | Set-Content windows/runner/Runner.rc

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set CMake flags for VS 2026
        run: |
          echo "CXXFLAGS=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" >> $env:GITHUB_ENV
          echo "CFLAGS=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" >> $env:GITHUB_ENV
        shell: powershell

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Download and verify SQLite DLL
        run: |
          Invoke-WebRequest -Uri "https://www.sqlite.org/2024/sqlite-dll-win-x64-${{ env.SQLITE_VERSION }}.zip" -OutFile sqlite.zip
          $actualHash = (Get-FileHash sqlite.zip -Algorithm SHA256).Hash
          if ($actualHash -ne "${{ env.SQLITE_SHA256 }}") {
            Write-Error "SQLite checksum mismatch! Expected: ${{ env.SQLITE_SHA256 }}, Got: $actualHash"
            exit 1
          }
          Expand-Archive sqlite.zip -DestinationPath sqlite
          Copy-Item sqlite\sqlite3.dll build\windows\x64\runner\Release\

      - name: Prepare Release Folder
        run: |
          New-Item -ItemType Directory -Path syndro-windows -Force
          Copy-Item -Path build\windows\x64\runner\Release\* -Destination syndro-windows\ -Recurse

      # Compile a per-user Inno Setup installer (installer/SyndroInstaller.iss)
      # from the built release folder. Output: dist/Syndro-Setup-<ver>.exe.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Windows installer
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$ver `
            "/DReleaseDir=$PWD\syndro-windows" `
            "/O$PWD\dist" `
            installer\SyndroInstaller.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      # Upload the raw folder as the workflow artifact. GitHub zips artifacts once
      # on download, so this also extracts in a single unzip (avoids double-zip).
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: syndro-windows-${{ github.run_number }}
          path: syndro-windows/**
          retention-days: 90

      - name: Attach Windows installer to Release
        if: ${{ needs.prepare.outputs.do_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Syndro ${{ needs.prepare.outputs.tag }}
          files: dist/Syndro-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # Android APK (signed release; skipped when signing secrets are missing)
  # ──────────────────────────────────────────────────────────────────────
  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ''
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # Decide whether a signed release build is possible. "release if available"
      # means: only when the signing keystore secret is present.
      - name: Detect signing secret
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No KEYSTORE_BASE64 secret — skipping the APK build."
          fi

      - name: Decode Keystore
        if: ${{ steps.signing.outputs.has_keystore == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -uo pipefail
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is empty or not set."
            exit 1
          fi

          OUT=android/app/keystore.jks
          TMP=$(mktemp)
          trap 'rm -f "$TMP" "$TMP.inner"' EXIT

          # The secret is base64 (optionally URL-safe) of the keystore file.
          normalized=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+')

          decode_ok=""
          # Attempt 1: the secret is a single base64-encoded keystore.
          # Note: decode to a temp file and verify with keytool BEFORE writing
          # the final path, so a failed attempt never truncates a good keystore.
          if printf '%s' "$normalized" | base64 -d > "$TMP" 2>/dev/null && \
             keytool -list -keystore "$TMP" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "Keystore decoded via: single base64"
            decode_ok="yes"
          fi

          # Attempt 2: the secret may be base64-of-base64 (double encoded).
          if [ -z "$decode_ok" ]; then
            if printf '%s' "$normalized" | base64 -d > "$TMP.inner" 2>/dev/null && \
               [ -s "$TMP.inner" ] && \
               tr -d '[:space:]' < "$TMP.inner" | tr '_-' '/+' | base64 -d > "$TMP" 2>/dev/null && \
               keytool -list -keystore "$TMP" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "Keystore decoded via: double base64"
              decode_ok="yes"
            fi
          fi

          if [ -z "$decode_ok" ]; then
            size=$(wc -c < "$TMP" 2>/dev/null || echo 0)
            echo "::debug::keytool output for the failed attempt:"
            keytool -list -keystore "$TMP" -storepass "$KEYSTORE_PASSWORD" 2>&1 | sed 's/^/  /' || true
            echo "::error::Could not obtain a keystore that opens with KEYSTORE_PASSWORD (decoded ${size} bytes). Check the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets."
            exit 1
          fi

          cp "$TMP" "$OUT"

          WANT_ALIAS="${KEY_ALIAS:-syndro}"
          if ! keytool -list -keystore "$OUT" -storepass "$KEYSTORE_PASSWORD" \
                -alias "$WANT_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore opened, but alias '$WANT_ALIAS' was not found."
            exit 1
          fi
          echo "Keystore decoded and verified (alias: $WANT_ALIAS)."

      - name: Build Release APK
        if: ${{ steps.signing.outputs.has_keystore == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # Rename the release APK with the version so the asset is self-describing.
      - name: Rename Release APK
        run: |
          set -e
          VER="${{ needs.prepare.outputs.version }}"
          mkdir -p dist
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/Syndro-${VER}.apk"
          fi

      - name: Upload Release APK artifact
        if: ${{ steps.signing.outputs.has_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: syndro-android-release-${{ github.run_number }}
          path: dist/Syndro-${{ needs.prepare.outputs.version }}.apk
          retention-days: 90

      - name: Attach APKs to Release
        if: ${{ needs.prepare.outputs.do_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Syndro ${{ needs.prepare.outputs.tag }}
          files: dist/Syndro-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


