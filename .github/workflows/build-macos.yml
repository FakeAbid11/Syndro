name: Build macOS

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '' }}
          channel: stable

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter compact

      # The committed macos/ project cannot be built: project.pbxproj is stripped of
      # PRODUCT_BUNDLE_IDENTIFIER / INFOPLIST_FILE / CODE_SIGN_ENTITLEMENTS /
      # DEVELOPMENT_TEAM, and macos/Runner/Base.lproj/MainMenu.xib is missing.
      # So the target is still regenerated here and the committed files are
      # discarded.
      #
      # That is also why the Info.plist keys added for LAN access
      # (NSAppTransportSecurity / NSAllowsLocalNetworking and
      # NSLocalNetworkUsageDescription) have never been exercised by a build:
      # regenerating replaces the file wholesale. Once a working macOS project is
      # committed, delete this step so the committed config is what gets built —
      # otherwise the two files silently diverge again.
      - name: Setup macOS platform
        run: |
          rm -rf macos
          flutter create --platforms=macos --project-name=syndro .
          # `flutter create` regenerates the default counter-app test/widget_test.dart
          # (referencing a `MyApp` class this project doesn't have), which breaks analyze.
          rm -f test/widget_test.dart

      - name: Update deployment target
        run: |
          sed -i '' 's/platform :osx, .10.14./platform :osx, "11.0"/' macos/Podfile
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.14/MACOSX_DEPLOYMENT_TARGET = 11.0/g' macos/Runner.xcodeproj/project.pbxproj

      - name: Update CocoaPods
        run: cd macos && pod repo update && pod install --repo-update

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/
