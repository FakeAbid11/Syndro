name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both
  push:
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ''
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Decode Keystore
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -uo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or not set."
            exit 1
          fi
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is empty or not set."
            exit 1
          fi

          OUT=android/app/keystore.jks

          # Normalise: drop all whitespace/BOM/CRLF the secret may carry, and
          # translate base64url (-_) to standard base64 (+/) so either alphabet works.
          normalized=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+')

          # Try to produce a valid keystore, most-likely encoding first.
          decode_ok=""
          try_decode() {
            # $1 = description; reads stdin base64, writes $OUT; returns 0 if the
            # result is a keystore readable with the given password.
            if base64 -d > "$OUT" 2>/dev/null && \
               keytool -list -keystore "$OUT" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "Keystore decoded via: $1"
              decode_ok="yes"
              return 0
            fi
            return 1
          }

          # 1) Straight base64 decode.
          printf '%s' "$normalized" | try_decode "single base64" || true

          # 2) Double-encoded? Decode once to text, then decode that as base64.
          if [ -z "$decode_ok" ]; then
            inner=$(printf '%s' "$normalized" | base64 -d 2>/dev/null | tr -d '[:space:]' | tr '_-' '/+')
            if [ -n "$inner" ]; then
              printf '%s' "$inner" | try_decode "double base64" || true
            fi
          fi

          if [ -z "$decode_ok" ]; then
            size=$(wc -c < "$OUT" 2>/dev/null || echo 0)
            echo "::error::Could not obtain a keystore that opens with KEYSTORE_PASSWORD (decoded ${size} bytes)."
            echo "::error::Either the store password is wrong, or KEYSTORE_BASE64 is not a valid keystore. Re-encode a known-good .jks with: base64 -w0 keystore.jks"
            exit 1
          fi

          # Store + password are good. Now confirm the requested alias exists.
          WANT_ALIAS="${KEY_ALIAS:-syndro}"
          if ! keytool -list -keystore "$OUT" -storepass "$KEYSTORE_PASSWORD" \
                -alias "$WANT_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore opened, but alias '$WANT_ALIAS' was not found. Aliases present:"
            keytool -list -keystore "$OUT" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -i "PrivateKeyEntry\|trustedCertEntry" || true
            echo "::error::Set the KEY_ALIAS secret to one of the aliases listed above."
            exit 1
          fi
          echo "Keystore decoded and verified (alias: $WANT_ALIAS)."

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: syndro-android-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: syndro-android-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
