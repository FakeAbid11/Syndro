name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both
  push:
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ''
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Decode Keystore
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          # 1) Secret present?
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or not set."
            exit 1
          fi
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is empty or not set."
            exit 1
          fi

          # 2) Decode. Strip whitespace/BOM/CRLF the secret may carry, then decode.
          #    base64 -d exits non-zero on invalid input, so a malformed secret
          #    fails HERE rather than deep inside Gradle packaging.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/keystore.jks; then
            echo "::error::base64 decode of KEYSTORE_BASE64 failed - the secret is not valid base64. Re-encode with: base64 -w0 keystore.jks"
            exit 1
          fi

          # 3) Non-empty output?
          size=$(wc -c < android/app/keystore.jks)
          echo "Decoded keystore size: ${size} bytes"
          if [ "$size" -lt 100 ]; then
            echo "::error::Decoded keystore is only ${size} bytes - the secret is truncated or wrong."
            exit 1
          fi

          # 4) Actually readable as a keystore with this password + alias?
          #    (Only stderr surfaces; the cert listing stays out of the log.)
          if ! keytool -list \
                -keystore android/app/keystore.jks \
                -storepass "$KEYSTORE_PASSWORD" \
                -alias "${KEY_ALIAS:-syndro}" > /dev/null; then
            echo "::error::keytool could not read the keystore. Either the .jks is corrupt (regenerate it), the store password is wrong, or alias '${KEY_ALIAS:-syndro}' does not exist."
            exit 1
          fi
          echo "Keystore decoded and verified."

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: syndro-android-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: syndro-android-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
